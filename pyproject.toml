[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-aware-gnn"
version = "0.2.0"
description = "Reproducible multi-property molecular benchmarks for edge-aware and descriptor-fused GNNs"
readme = "ReadMe.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
  "rdkit>=2024.3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "torch>=2.2,<3",
  "torch-geometric>=2.5,<3",
]

[project.optional-dependencies]
boosting = ["xgboost>=2,<4"]
chemprop = ["chemprop>=2.1,<3"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
edgegnn = "edge_aware_gnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

