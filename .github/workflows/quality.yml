name: quality

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight validation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas PyYAML rdkit scikit-learn scipy pytest ruff
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Validate experiment plan
        run: edgegnn plan --config configs/benchmark.yaml --dataset esol --model rf_rdkit --split random --seed 2026
      - name: Validate repository and completed results
        run: edgegnn validate --root .
      - name: Regenerate publication tables
        run: |
          edgegnn publication --tables-only --output /tmp/edgegnn-publication
          test -s /tmp/edgegnn-publication/analysis_manifest.json
